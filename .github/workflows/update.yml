name: Update EPG 14 Days

on:
  schedule:
    # Запуск каждый день в 4:00 утра UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Позволяет запускать обновление вручную кнопкой в интерфейсе

jobs:
  update-epg:
    runs-on: windows-latest # Запускаем на виртуальной машине Windows для PowerShell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run EPG Update Script
        shell: pwsh
        run: |
          # Запускаем ваш скрипт (убедитесь, что имя файла ниже совпадает с вашим файлом скрипта)
          ./update_epg.ps1

      - name: Commit and push updated EPG
        run: |
          git config --global user.name "EPG Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add my_14day_epg.xml
          git commit -m "Auto-update EPG archive [skip ci]" || echo "No changes to commit"
          git push
