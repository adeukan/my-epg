name: Update EPG 14 Days

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  update-epg:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs track "my_14day_epg.xml"

      - name: Run EPG Update Script
        shell: pwsh
        run: |
          ./update_epg.ps1

      - name: Commit and push updated EPG
        run: |
          git config --global user.name "EPG Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add my_14day_epg.xml
          git add .gitattributes
          git commit -m "Auto-update EPG archive via LFS [skip ci]" || echo "No changes to commit"
          git push
